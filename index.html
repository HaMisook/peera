<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피어라 매직!</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a4458; --muted:#8b8499; --faint:#b8b1c4; --bg:#fdf8f4; --line:#f0e8ee;
    --pink:#ffd6e8; --pink-deep:#e484ac;
    --lemon:#fff3c9; --lemon-deep:#d9a520;
    --mint:#d3f2e4; --mint-deep:#5bbd94;
    --peach:#ffe4d1; --peach-deep:#f09a6a;
    --sky:#d6ebff; --sky-deep:#6aa5e0;
    --lavender:#e8ddff; --lavender-deep:#9d7fd8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--ink); line-height:1.5;
    font-family:"Pretendard","Pretendard Variable",-apple-system,system-ui,sans-serif;
  }
  .page{max-width:560px; margin:0 auto; padding:22px 16px 40px;}
  .logo{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .logo .mark{
    width:40px; height:40px; border-radius:13px; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--pink),var(--lavender) 55%,var(--sky));
  }
  .logo h1{font-family:"Jua","Pretendard",sans-serif; font-weight:400; font-size:24px; margin:0;}
  .logo h1 span{color:var(--pink-deep);}
  h2{font-family:"Jua","Pretendard",sans-serif; font-weight:400; font-size:19px; margin:22px 2px 10px;}

  /* 대단원: 접었다 폈다 */
  details{border-radius:16px; border:1px solid var(--c); background:#fff; margin-bottom:10px; overflow:hidden;}
  summary{
    list-style:none; cursor:pointer; user-select:none;
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; font-size:16.5px; font-weight:700; background:var(--bgc);
  }
  summary::-webkit-details-marker{display:none;}
  summary::after{content:"›"; margin-left:auto; font-size:22px; line-height:1; color:var(--d); transition:transform .15s;}
  details[open] summary::after{transform:rotate(90deg);}
  summary:focus-visible, .list a:focus-visible, .list button:focus-visible{outline:3px solid var(--d); outline-offset:-3px;}
  .list{display:flex; flex-direction:column; padding:6px;}
  .list a, .list button{
    display:flex; align-items:center; gap:10px;
    padding:12px 12px; border-radius:11px;
    font-size:16px; font-weight:600; color:var(--ink); text-decoration:none;
  }
  .list button{border:none; background:none; font-family:inherit; text-align:left; cursor:pointer; width:100%;}
  .list a::before, .list button::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--d); flex:none;}
  .list a:hover, .list button:hover{background:var(--bgc);}

  /* 대단원별 색 (u1~u6) */
  .u1{--c:var(--pink);     --d:var(--pink-deep);     --bgc:#fff3f8;}
  .u2{--c:var(--lemon);    --d:var(--lemon-deep);    --bgc:#fffbea;}
  .u3{--c:var(--mint);     --d:var(--mint-deep);     --bgc:#effaf5;}
  .u4{--c:var(--peach);    --d:var(--peach-deep);    --bgc:#fff5ee;}
  .u5{--c:var(--sky);      --d:var(--sky-deep);      --bgc:#eff6ff;}
  .u6{--c:var(--lavender); --d:var(--lavender-deep); --bgc:#f5f0ff;}
</style>
</head>
<body>
<main class="page">

  <div class="logo">
    <span class="mark">✨</span>
    <h1>피어라 <span>매직!</span></h1>
  </div>

  <!-- 새 단원을 넣을 때: 아래 <details> 한 덩어리를 복사해 u1~u6 색과 제목, 목록만 바꾸면 됩니다.
       처음부터 펼쳐 두려면 <details class="u5" open&gt; 처럼 open 을 붙입니다. -->

  <h2>중1</h2>

  <details class="u5">
    <summary>5. 평면도형과 입체도형</summary>
    <div class="list">
      <a href="polyhedron.html">5.2.2. 정다면체</a>
    </div>
  </details>

  <details class="u6">
    <summary>6. 통계</summary>
    <div class="list">
      <a href="daepyo.html">6.1.1. 대푯값</a>
      <a href="stem-leaf.html">6.2.1. 줄기와 잎 그림</a>
    </div>
  </details>

  <details class="u3">
    <summary>공학 도구</summary>
    <div class="list">
      <a href="tonggraph.html">통그래프</a>
      <button type="button" onclick="if(window.peeraTimerOpen)peeraTimerOpen()">타이머</button>
    </div>
  </details>

</main>
<script src="timer.js" defer data-launch="off"></script>
</body>
</html>
